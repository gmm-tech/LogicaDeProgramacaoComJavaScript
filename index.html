        body {

        button {
            width: 110px;
            height: 90px;
            color: #ffffff;
            background-color: #2155ff;
            border: none;
            border-radius: 14px;
            margin: 7px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #1640cc;
        }

        button:active {
            transform: scale(0.95);
        }

        .consoleLog {
            color: #000000;
            background-color: #ffff5f;
        }

        .consoleLog:hover {
            background-color: #dcdc1c;
        }

        .terminal-container {

            padding: 15px;

            font-size: 16px;
